AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Shorts QC live HTTPS upload and OpenCV 5 analysis within Free plan credits
Parameters:
  ImageUri:
    Type: String
  ArtifactBucket:
    Type: String
  ApiZipKey:
    Type: String
  CommerceStateSecrets:
    Type: String
    Default: '{}'
    NoEcho: true

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}-uploads'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag, x-amz-request-id]
            MaxAge: 300
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUploadsAfterSevenDays
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub '${UploadBucket.Arn}/*'
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  ReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteReportsAfterThirtyDays
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 30
  Jobs:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: job_id, AttributeType: S}]
      KeySchema: [{AttributeName: job_id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  AnalyzeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-analyze'
      RetentionInDays: 14
  Analyze:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-analyze'
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 180
      ReservedConcurrentExecutions: 1
      EphemeralStorage: {Size: 1024}
      Environment:
        Variables:
          UPLOAD_BUCKET: !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}-uploads'
          REPORT_BUCKET: !Ref ReportBucket
          JOBS_TABLE: !Ref Jobs
          MAX_UPLOAD_BYTES: '26214400'
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
      Role: !GetAtt AnalyzeRole.Arn
      Events:
        Uploaded:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules: [{Name: prefix, Value: incoming/}]
  AnalyzeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BoundedAnalysis
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject']
                # Literal name avoids a bucket-notification dependency cycle.
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}-uploads/incoming/*'
              - Effect: Allow
                Action: ['s3:PutObject']
                Resource: !Sub '${ReportBucket.Arn}/reports/*'
              - Effect: Allow
                Action: ['dynamodb:PutItem', 'dynamodb:UpdateItem']
                Resource: !GetAtt Jobs.Arn
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !GetAtt AnalyzeLogGroup.Arn
  AnalysisErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Check the Lambda log group and failed DynamoDB job records.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref Analyze}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 14
  Api:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: python3.12
      Handler: api.handler
      CodeUri:
        Bucket: !Ref ArtifactBucket
        Key: !Ref ApiZipKey
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 4
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          REPORT_BUCKET: !Ref ReportBucket
          JOBS_TABLE: !Ref Jobs
          COMMERCE_STATE_SECRETS: !Ref CommerceStateSecrets
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['s3:GetObject', 's3:PutObject']
              Resource: !Sub '${UploadBucket.Arn}/incoming/*'
            - Effect: Allow
              Action: ['s3:GetObject']
              Resource:
                - !Sub '${UploadBucket.Arn}/demo/*'
                - !Sub '${ReportBucket.Arn}/reports/*'
                - !Sub '${ReportBucket.Arn}/demo/*'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt Jobs.Arn
  DemoBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly-5-usd'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 5, Unit: USD}
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
  ApiTrafficAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Public demo traffic above expected judging use; inspect budget and set API concurrency to zero if needed.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{Name: FunctionName, Value: !Ref Api}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  UploadBucket: {Value: !Ref UploadBucket}
  ReportBucket: {Value: !Ref ReportBucket}
  JobsTable: {Value: !Ref Jobs}
  AnalyzeFunction: {Value: !Ref Analyze}
  ApiFunction: {Value: !Ref Api}
  ViewerURL: {Value: !GetAtt ApiUrl.FunctionUrl}
  UploadEndpoint: {Value: !Sub '${ApiUrl.FunctionUrl}api/uploads'}
  Logs: {Value: !Ref AnalyzeLogGroup}
