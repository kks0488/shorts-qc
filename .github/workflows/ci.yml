name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - run: pip install -r requirements.lock && pip install --no-deps --no-build-isolation -e .
      - run: python -m shorts_qc.model --output models/text.onnx
      - run: python -m pytest -q
        env:
          SHORTS_QC_TEXT_MODEL: models/text.onnx
      - run: bash -n infra/deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Verify browser and video seeking
        shell: bash
        run: |
          timeout 90 shorts-qc serve media --host 127.0.0.1 --port 18765 > /tmp/shorts-qc-viewer.log 2>&1 &
          viewer_pid=$!
          trap 'kill "$viewer_pid" 2>/dev/null || true' EXIT
          VIEWER_URL=http://127.0.0.1:18765 CAPTURE_DIR=/tmp/shorts-qc-capture npm run capture
